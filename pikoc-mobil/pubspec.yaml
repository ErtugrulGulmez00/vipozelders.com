name: pikoc
description: "Pi Koç: bireysel koçluk takibi (koç, öğrenci ve veli)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  # Online görüşme: uygulama LiveKit'e kendisi bağlanır (Android'de ekran paylaşımı da açılır)
  livekit_client: ^2.13.2
  flutter_webrtc: ^1.6.3
  # Android ekran paylaşımı için ön plan hizmeti (MediaProjection)
  flutter_background: ^1.3.1
  # 13.x Android Gradle Plugin 9 gerektiriyor; proje AGP 8 ile derlenir
  permission_handler: ^12.0.1
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

# Simgeler: dart run flutter_launcher_icons (kaynak: assets/branding, Pi Koç markası)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"

# Açılış ekranı: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1B1F3B"
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_android12.png
    color: "#1B1F3B"
  web: false
