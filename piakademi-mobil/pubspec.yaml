name: pikampus
description: "Pi Kampüs mobil uygulaması: özel ders, sanal sınıf ve kurum veli portalı."
publish_to: 'none'

# sürüm+derleme numarası (Android versionName+versionCode, iOS CFBundleShortVersionString+CFBundleVersion)
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Durum, yönlendirme, HTTP
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  intl: ^0.20.2

  # Oturum anahtarı
  flutter_secure_storage: ^11.2.0

  # Ödeme ve sanal sınıf (sitedeki sayfalar WebView'da)
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  # 13.x Android Gradle Plugin 9 gerektiriyor; proje AGP 8 ile derlendiği için 12.x
  permission_handler: ^12.0.1
  wakelock_plus: ^1.7.0

  # Bildirimler
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2

  # Medya, bağlantılar, paylaşım, takvim
  cached_network_image: ^3.4.1
  image_picker: ^1.2.4
  video_player: ^2.11.1
  url_launcher: ^6.3.3
  app_links: ^7.0.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Sitedeki yazı tipleri (SIL Open Font License, assets/fonts/OFL.txt): gövde DM Sans, başlıklar Bricolage Grotesque
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

# Simgeler: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/adaptive_background.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/branding/adaptive_monochrome.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#1B1F3B"
    theme_color: "#D63F1C"

# Açılış ekranı: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1B1F3B"
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_android12.png
    color: "#1B1F3B"
  web: false
